<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BEXO Design Preview</title><link rel="stylesheet" href="design-system.css"><style>body{max-width:1100px;margin:0 auto;padding:2rem;background:var(--color-warm)} .swatch{display:inline-block;width:72px;height:72px;border-radius:10px;border:1px solid var(--color-border);margin-right:8px} pre{background:var(--color-surface);padding:12px;border-radius:10px;overflow:auto}</style></head><body>
<h1 style="font-size:var(--text-3xl);letter-spacing:-0.02em">BEXO — Attention Market <span class="badge-featured" style="vertical-align:middle">Featured</span></h1>
<p style="color:var(--color-muted)">Pozy rank + Outbids density — lime only for money</p>
<h3>Palette</h3><div><span class="swatch" style="background:#111318"></span><span class="swatch" style="background:#F7F7F2"></span><span class="swatch" style="background:#C8FF3D"></span><span class="swatch" style="background:#7C5CFC"></span><span class="swatch" style="background:#667085"></span></div>
<h3>Board Row</h3><div class="board-row"><span class="board-num">01</span><img src="https://picsum.photos/seed/bexo/40/40" width="40" height="40" style="border-radius:50%"><div><strong>Rahul Sharma — AI Engineer</strong><div style="color:var(--color-muted);font-size:var(--text-sm)">4y • Bangalore • Remote • Actively looking</div></div><div><span class="badge-featured">Featured</span> <span class="mono" style="font-size:var(--text-sm)"> $10</span></div></div>
<h3>Chips</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip" data-active="true">AI / Infra</span><span class="chip">Design</span><span class="chip">Marketing</span></div>
<h3>Buttons</h3><button class="btn-primary">Boost My Profile — $10</button> <button class="btn-secondary">Explore Talent</button>
<h3>Tokens</h3><pre id="tokens"></pre><script>fetch('design-tokens.json').then(r=>r.json()).then(j=>document.getElementById('tokens').textContent=JSON.stringify(j,null,2))</script>
</body></html>
